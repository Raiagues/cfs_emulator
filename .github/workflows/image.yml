name: Publish emulator image

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - cfs.service
      - config/**
      - scripts/emulator.sh
      - scripts/qemu-*.patch
      - project/qemu/**
      - project/sensor_models.py
      - project/drivers/models/**
      - .github/workflows/image.yml

jobs:
  publish:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.tag.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Identify the compiled sensor models
        id: tag
        run: |
          digest=$(python3 project/qemu/generate.py --fingerprint)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:models-$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: REGISTER_MODELS=${{ steps.tag.outputs.digest }}
          push: true
          tags: ${{ steps.tag.outputs.image }}-${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both native architectures
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: docker buildx imagetools create -t "$IMAGE" "$IMAGE-$GITHUB_SHA-amd64" "$IMAGE-$GITHUB_SHA-arm64"
