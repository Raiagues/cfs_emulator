.fs-root.fs-light .fs-dark{--c0d1115:#0d1115;--c11171c:#11171c;--c13171c:#13171c;--c14181d:#14181d;--c161a20:#161a20;--c163b30:#163b30;--c1a1f25:#1a1f25;--c1b150c:#1b150c;--c1c1f24:#1c1f24;--c1f7a5b:#1f7a5b;--c22272e:#22272e;--c262c34:#262c34;--c2b313a:#2b313a;--c2e9a74:#2e9a74;--c2f363f:#2f363f;--c3a414b:#3a414b;--c3a424c:#3a424c;--c3e8f72:#3e8f72;--c4b525c:#4b525c;--c5b636d:#5b636d;--c5b8fb0:#5b8fb0;--c5fc9a3:#5fc9a3;--c7cb4f0:#7cb4f0;--c7d8590:#7d8590;--c8e96a1:#8e96a1;--c9aa2ad:#9aa2ad;--c9fdcc4:#9fdcc4;--ca4acb6:#a4acb6;--cb7bfc4:#b7bfc4;--cb9c0c8:#b9c0c8;--cc3a6ff:#c3a6ff;--cc9cfd6:#c9cfd6;--cc9d0d4:#c9d0d4;--cd4b48a:#d4b48a;--cd7dbe0:#d7dbe0;--cd7dee0:#d7dee0;--cd9a35b:#d9a35b;--ce8c08a:#e8c08a;--ce8cda8:#e8cda8;--ceef0f2:#eef0f2;--cff7a59:#ff7a59;--r95_201_163:95,201,163;--r212_180_138:212,180,138;--r217_163_91:217,163,91;--c161a1f:#161a1f;--c16261f:#16261f;--c2a241c:#2a241c;--c2f6e58:#2f6e58;--c6b7380:#6b7380;--c9fe3c9:#9fe3c9;--cf3dcb8:#f3dcb8;--c0f1318:#0f1318;--c15271f:#15271f;--c16212e:#16212e;--c181d23:#181d23;--c1b2026:#1b2026;--c1d2228:#1d2228;--c1f4a3a:#1f4a3a;--c20252b:#20252b;--c20262d:#20262d;--c241a22:#241a22;--c242a31:#242a31;--c343c47:#343c47;--c34506e:#34506e;--c3fa982:#3fa982;--c6d5a40:#6d5a40;--c8a7152:#8a7152;--c8fa3b8:#8fa3b8;--ca9cdf5:#a9cdf5;--cc48ab4:#c48ab4;--cc9d0d8:#c9d0d8;--ce2c296:#e2c296;--ce7c4dc:#e7c4dc}
/*fs-anim*/
@keyframes fsSpin{to{transform:rotate(360deg)}}
.fs-spin{animation:fsSpin .9s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes fsDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fs-draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:fsDraw .45s .12s ease-out forwards}
@keyframes fsPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
.fs-pop{animation:fsPop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes fsRing{0%{box-shadow:0 0 0 0 rgba(var(--r95_201_163),.55)}100%{box-shadow:0 0 0 16px rgba(var(--r95_201_163),0)}}
.fs-ring{animation:fsRing 1s ease-out 2}
@keyframes fsIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fs-in{animation:fsIn .35s ease-out both}
@keyframes fsPing2{0%{box-shadow:0 0 0 0 rgba(var(--r212_180_138),.5)}100%{box-shadow:0 0 0 8px rgba(var(--r212_180_138),0)}}
.fs-ping2{animation:fsPing2 1.3s ease-out infinite}
@keyframes fsDash{to{stroke-dashoffset:-20}}
.fs-dash{stroke-dasharray:4 6;animation:fsDash .7s linear infinite}
@keyframes fsPulse{0%,100%{opacity:1}50%{opacity:.4}}
.fs-pulse{animation:fsPulse 1.1s ease-in-out infinite}
/*/fs-anim*/
@keyframes fsCoach2{0%{box-shadow:0 0 0 0 rgba(212,180,138,.45)}100%{box-shadow:0 0 0 8px rgba(212,180,138,0)}}.fs-coach{animation:fsCoach2 1.8s ease-out infinite!important}.fs-coach::after{display:none!important}
</style><style>body{margin:0}</style></head><body><template id="tpl">
<div class="fs-root {{themeCls}}" style="min-height: 1000px; background: var(--c13171c); color: var(--cd7dbe0); font-family: Inter, system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column">

<header style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--c22272e)">
  <span style="font-size: 15px; color: var(--ceef0f2)"><span style="font-weight: 600">Flight</span> <span style="color: var(--c9aa2ad)">studio</span> <span style="color: var(--c4b525c); margin: 0 8px">/</span><span style="color: var(--cb9c0c8); font-size: 13px">boot_cfs</span></span>
  <span style="display: flex; align-items: center; gap: 14px"><span style="display: flex; align-items: center; gap: 6px; color: var(--c8e96a1)"><span style="width: 6px; height: 6px; border-radius: 99px; background: var(--c5fc9a3)"></span>Saved</span><button onClick="{{toggleTheme}}" aria-label="Switch between light and dark" style="width: 30px; height: 30px; border: 1px solid var(--c2b313a); border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true" style="stroke: var(--ca4acb6)"><path d="{{themeIcon}}"></path></svg></button></span>
</header>
<!--fs-guide-->
<div aria-label="First steps guide" style="height: 44px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--c22272e); background: var(--c161a1f)">
  <span style="flex: none; display: flex; align-items: baseline; gap: 8px"><span style="font-size: 12px; font-weight: 500; color: var(--ceef0f2)">First steps</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c7d8590)">{{gd.count}}/{{gd.total}}</span></span>
  <div style="flex: 1; min-width: 0; display: flex; align-items: center">
    <sc-for list="{{gd.steps}}" as="gs" hint-placeholder-count="9">
      <sc-if value="{{gs.notFirst}}" hint-placeholder-val="{{true}}"><span style="flex: 1; min-width: 8px; height: 2px; border-radius: 2px; background: {{gs.line}}"></span></sc-if>
      <a href="{{gs.href}}" title="{{gs.title}}" style="flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 99px; background: {{gs.bg}}; text-decoration: none">
        <span class="{{gs.cls}}" style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 99px; border: 1.5px solid {{gs.border}}; background: {{gs.fill}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{gs.done}}" hint-placeholder-val="{{false}}"><svg class="fs-draw" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c9fe3c9)"><path d="M5 12l5 5L20 7" pathLength="1"></path></svg></sc-if>
          <sc-if value="{{gs.notDone}}" hint-placeholder-val="{{true}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{gs.num}}">{{gs.n}}</span></sc-if>
        </span>
        <span style="font-size: 11px; color: {{gs.fg}}; white-space: nowrap">{{gs.label}}</span>
      </a>
    </sc-for>
  </div>
  <span style="flex: none; display: flex; align-items: center; gap: 8px">
    <sc-if value="{{gd.away}}" hint-placeholder-val="{{false}}"><a href="{{gd.href}}" title="{{gd.title}}" class="fs-coach" style="position: relative; height: 28px; flex: none; padding: 0 12px; border-radius: 4px; background: var(--cd4b48a); color: var(--c1b150c); font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-weight: 400; opacity: 0.75">Next</span>{{gd.go}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c1b150c)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-if>
    <button onClick="{{gd.reset}}" aria-label="Start the guide over" title="Start over" style="width: 26px; height: 26px; flex: none; border-radius: 4px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c6b7380)"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.5L4 8.5M4 4v4.5h4.5"></path></svg></button>
  </span>
</div>
<!--/fs-guide-->

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 32px 40px; gap: 16px">
  <div style="width: 100%; max-width: 1180px; display: flex; align-items: center; gap: 14px">
    <h1 style="margin: 0; font-size: 20px; font-weight: 500; color: var(--ceef0f2); letter-spacing: -0.01em">First boot</h1>
    <span style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 4px; background: var(--c1a1f25); font-size: 12px; color: var(--cc9cfd6)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c5fc9a3)"><path d="{{tg.icon}}"></path></svg>{{tg.label}}</span>
    <a href="Main.dc.html" style="font-size: 12px; text-decoration: none">change</a>
    <span style="flex: 1"></span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ca4acb6)">{{elapsed}}</span>
    <button onClick="{{togglePause}}" aria-label="{{pauseAria}}" style="width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--c2b313a); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--cc9cfd6)"><path d="{{pauseIcon}}"></path></svg></button>
    <button onClick="{{replay}}" aria-label="Run again" title="Run again" style="width: 30px; height: 30px; border-radius: 4px; border: 1px solid var(--c2b313a); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--cc9cfd6)"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.5L4 8.5M4 4v4.5h4.5"></path></svg></button>
  </div>

  <div style="width: 100%; max-width: 1180px; display: flex; align-items: center">
    <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
      <sc-if value="{{p.notFirst}}" hint-placeholder-val="{{true}}">
        <span aria-hidden="true" style="flex: 0 0 40px; display: flex; align-items: center"><svg width="40" height="6" viewBox="0 0 40 6" fill="none"><path d="M2 3h36" stroke-width="2" stroke-linecap="round" class="{{p.lineCls}}" style="stroke: {{p.line}}"></path></svg></span>
      </sc-if>
      <div style="flex: 1; min-width: 0; padding: 10px 14px; border-radius: 6px; background: {{p.bg}}; border: 1px solid {{p.border}}; display: flex; align-items: center; gap: 12px">
        <span style="position: relative; width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{p.waiting}}" hint-placeholder-val="{{false}}"><span style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 99px; border: 1.5px solid var(--c343c47); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c6b7380)">{{p.n}}</span></sc-if>
          <sc-if value="{{p.running}}" hint-placeholder-val="{{true}}">
            <svg class="fs-spin" width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0"><circle cx="15" cy="15" r="13.5" stroke-width="1.5" style="stroke: var(--c2b313a)"></circle><path d="M15 1.5A13.5 13.5 0 0128.5 15" stroke-width="2" stroke-linecap="round" style="stroke: var(--cd4b48a)"></path></svg>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ce8cda8)">{{p.n}}</span>
          </sc-if>
          <sc-if value="{{p.done}}" hint-placeholder-val="{{false}}"><span class="fs-pop" style="width: 28px; height: 28px; border-radius: 99px; background: var(--c16261f); border: 1.5px solid var(--c3e8f72); box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg class="fs-draw" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c9fe3c9)"><path d="M5 12l5 5L20 7" pathLength="1"></path></svg></span></sc-if>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
          <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 13px; color: {{p.fg}}">{{p.title}}</span><span style="flex: 1"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c8e96a1); white-space: nowrap">{{p.sub}}</span></span>
          <span style="height: 3px; border-radius: 2px; background: var(--c22272e); overflow: hidden"><span style="display: block; height: 3px; width: {{p.pct}}%; border-radius: 2px; background: {{p.bar}}"></span></span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="width: 100%; max-width: 1180px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start">
    <section aria-label="How cFS is built" style="padding: 16px; border-radius: 6px; background: var(--c181d23); border: 1px solid var(--c242a31); display: flex; flex-direction: column; gap: 8px">
      <span style="padding: 0 2px 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--c8e96a1)">CFS · LAYER BY LAYER</span>
      <sc-for list="{{layers}}" as="ly" hint-placeholder-count="6">
        <button onClick="{{ly.pick}}" title="{{ly.full}}" style="min-height: 52px; padding: 8px 14px; box-sizing: border-box; border-radius: 6px; border: {{ly.border}}; background: {{ly.bg}}; color: inherit; font: inherit; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 6px; background: {{ly.tile}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{ly.ic}}"><path d="{{ly.icon}}"></path></svg></span>
          <span style="width: 120px; flex: none; font-size: 13px; color: {{ly.fg}}">{{ly.name}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{ly.chips}}" as="c" hint-placeholder-count="4">
              <sc-if value="{{c.on}}" hint-placeholder-val="{{true}}"><span class="fs-pop" style="display: flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 4px; background: {{c.bg}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{c.fg}}">{{c.name}}</span></sc-if>
              <sc-if value="{{c.off}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; height: 26px; padding: 0 10px; box-sizing: border-box; border-radius: 4px; border: 1px dashed var(--c2b313a); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c4b525c)">{{c.name}}</span></sc-if>
            </sc-for>
          </span>
        </button>
      </sc-for>
      <div style="display: flex; gap: 4px; padding: 8px 2px 0">
        <sc-for list="{{states}}" as="s" hint-placeholder-count="5">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <span class="{{s.cls}}" style="height: 3px; border-radius: 2px; background: {{s.c}}"></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{s.fg}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
          </span>
        </sc-for>
      </div>
    </section>

    <section aria-label="Layer" style="min-height: 440px; box-sizing: border-box; padding: 18px; border-radius: 6px; background: var(--c181d23); border: 1px solid var(--c242a31); display: flex; flex-direction: column; gap: 16px">

      ['board', 'Board', 'Main', 'Run it on the real board']
    ];
    const jr = this.journey(), first = S.findIndex(s => s[2] === here);

    });

    if (tg === 'emu') { add(4.6, '$ qemu-system-aarch64 -M raspi4b -kernel kernel8.img …', CMD); add(5.6, 'Linux booting inside QEMU', DIM); add(7.1, '$ ./core-cpu1', CMD); }
    if (tg === 'board') { add(4.6, '$ scp -r build/exe/cpu1 emilly@raspberrypi4.local:~/cfs', CMD); add(6.3, '$ ssh emilly@raspberrypi4.local sudo systemctl start cfs', CMD); }
    if (tg === 'native') add(4.3, '$ cd build/exe/cpu1 && ./core-cpu1', CMD);
    const T = (x) => '1980-012-14:03:' + (20 + x / 3).toFixed(5).padStart(8, '0');
    const SYS = (x, state) => add(C0 + x, 'CFE_ES_Main: CFE_ES_Main ' + (state === 'EARLY_INIT' ? 'in ' : 'entering ') + state + ' state', LOG);
    const EV = (x, app, eid, msg, c) => add(C0 + x, 'EVS Port1 ' + T(x) + ' 66/1/' + app + ' ' + eid + ': ' + msg, c || EVS);
    SYS(0.1, 'EARLY_INIT'); SYS(4.0, 'CORE_STARTUP'); EV(4.3, 'CFE_ES', 1, 'cFE ES Initialized: …');
    SYS(6.6, 'CORE_READY'); SYS(6.8, 'APPS_INIT');
    EV(7.2, 'CI_LAB', 3, 'CI Lab Initialized. …'); EV(7.8, 'TO_LAB', 1, 'TO Lab Initialized. …, Awaiting enable command.', WARN);
    EV(9.0, 'SAMPLE_APP', 1, 'Sample App Initialized. …'); SYS(9.8, 'OPERATIONAL');
    const printed = L.filter(x => x.t <= el);
    const con = printed.slice(-12).map(x => ({ t: x.text, c: x.c }));

    /* stages */
    const phases = PL.phases.map((p, i) => {
      const run = el >= p.t0 && el < p.t1, ok = el >= p.t1, f = ok ? 1 : (run ? (el - p.t0) / (p.t1 - p.t0) : 0);
      let sub = '';
      if (ok) sub = p.id === 'cfs' ? 'OPERATIONAL' : (p.id === 'build' ? 'core-cpu1 ready' : (p.id === 'emu' ? 'Pi 4B running' : 'on the board'));
      else if (run) sub = p.id === 'build' ? (el < 0.9 ? 'configuring' : (el < 4.1 ? 'compiling ' + Math.round(100 * (el - 0.9) / 3.2) + '%' : 'installing')) : (p.id === 'emu' ? 'booting Linux' : (p.id === 'copy' ? 'copying' : 'starting'));
      return { n: String(i + 1), title: p.title, sub, waiting: !run && !ok, running: run, done: ok, notFirst: i > 0, pct: String(Math.round(f * 100)),
        bar: ok ? '#3fa982' : '#d4b48a', bg: run ? '#1d2228' : '#181d23', border: run ? '#6d5a40' : '#242a31', fg: run || ok ? '#eef0f2' : '#8e96a1',
        line: el >= p.t0 ? '#3fa982' : '#2b313a', lineCls: el >= p.t0 - 0.3 && el < p.t0 + 0.3 ? 'fs-dash' : '' };
    });

    /* ES state machine, names from cfe_es_start.c */
    const SS = [['EARLY_INIT', 0.1], ['CORE_STARTUP', 4.0], ['CORE_READY', 6.6], ['APPS_INIT', 6.8], ['OPERATIONAL', 9.8]];
    let curS = -1; SS.forEach((x, i) => { if (el >= C0 + x[1]) curS = i; });
    const states = SS.map((x, i) => ({ name: x[0], c: i < curS || (i === curS && done) ? '#3fa982' : (i === curS ? '#d4b48a' : '#262c34'), fg: i <= curS ? '#c9cfd6' : '#5b636d', cls: i === curS && !done ? 'fs-pulse' : '' }));

    /* the layers, top to bottom */
    const hwAt = tg === 'native' ? C0 : PL.e0, osAt = tg === 'emu' ? PL.e0 + 1.2 : (tg === 'board' ? PL.e0 : C0);
    const KIND = { app: ['#16212e', '#a9cdf5', '#7cb4f0'], cfe: ['#241a22', '#e7c4dc', '#c48ab4'], base: ['#20252b', '#c9cfd6', '#a4acb6'], hw: ['#15271f', '#9fe3c9', '#5fc9a3'] };
    const chip = (name, at, k) => ({ name, on: el >= at, off: el < at, bg: KIND[k][0], fg: KIND[k][1] });
    const LY = [
      { id: 'apps', name: 'Apps', full: 'the mission programs', k: 'app', icon: 'M4 5h16v14H4zM8 9h8M8 13h5', at: C0 + 7.2, chips: [chip('ci_lab', C0 + 7.2, 'app'), chip('to_lab', C0 + 7.8, 'app'), chip('sch_lab', C0 + 8.4, 'app'), chip('sample_app', C0 + 9.0, 'app')] },
      { id: 'cfe', name: 'cFE', full: 'core Flight Executive', k: 'cfe', icon: 'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5', at: C0 + 4.2, chips: ['ES', 'EVS', 'SB', 'TBL', 'TIME', 'FS'].map((n, i) => chip(n, C0 + 4.2 + i * 0.4, 'cfe')) },
      { id: 'osal', name: 'OSAL', full: 'OS Abstraction Layer', k: 'base', icon: 'M4 7h16M4 12h16M4 17h16', at: C0 + 2.2, chips: [chip('tasks', C0 + 2.2, 'base'), chip('queues', C0 + 2.5, 'base'), chip('files', C0 + 2.8, 'base'), chip('timers', C0 + 3.1, 'base')] },
      { id: 'psp', name: 'PSP', full: 'Platform Support Package', k: 'base', icon: 'M6 6h12v12H6zM9 2v4M15 2v4M9 18v4M15 18v4', at: C0 + 0.2, chips: [chip('pc-linux', C0 + 0.2, 'base')] },
      { id: 'os', name: TG.os, full: TG.osFull, k: 'hw', icon: 'M4 5h16v14H4zM8 10l3 2-3 2M13 15h3', at: osAt, chips: [chip('Linux', osAt, 'hw')] },
      { id: 'hw', name: TG.hw, full: TG.hwFull, k: 'hw', icon: 'M2.5 5.5h19v13h-19zM6 9h.01M8.5 9h.01M11 9h.01M13.5 9h.01M7 13h4v2.5H7z', at: hwAt, chips: [chip(tg === 'native' ? 'x86_64' : 'BCM2711 · 4 cores', hwAt, 'hw')] }
    ];
    let auto = 'build';
    if (el >= hwAt) auto = 'hw';
    if (el >= osAt + 0.6 && el >= hwAt) auto = 'os';
    if (el >= C0 + 0.2) auto = 'psp';
    if (el >= C0 + 2.2) auto = 'osal';
    if (el >= C0 + 4.2) auto = 'cfe';
    if (el >= C0 + 7.2) auto = 'apps';
    const active = st.pick || auto;
    const layers = LY.map(ly => {
      const lit = el >= ly.at, on = ly.id === active, K = KIND[ly.k];
      return { name: ly.name, full: ly.full, icon: ly.icon, chips: ly.chips, pick: () => this.setState({ pick: ly.id }),
        border: on ? '1.5px solid #d4b48a' : (lit ? '1px solid transparent' : '1px dashed #2b313a'), bg: on ? '#20262d' : (lit ? '#1b2026' : 'transparent'),
        tile: lit ? K[0] : '#1a1f25', ic: lit ? K[2] : '#4b525c', fg: lit ? '#eef0f2' : '#6b7380' };
    });

    /* the card on the right: a picture of the active layer */
    const GREEN = '#5fc9a3', SAND = '#d4b48a';
    const ICON = { build: 'M14.5 12.5l-8 8a2 2 0 01-2.9-2.9l8-8M17.5 15.5l4-4M20.6 12.4l-1.4-1.4a2.6 2.6 0 01-.7-1.8V8.6L15.8 6a5 5 0 00-3.5-1.5H10l1 .9a5 5 0 011.7 3.8v.9l1.8 1.8h1.6l2 1.6' };
    LY.forEach(l => { ICON[l.id] = l.icon; });
    const KK = { build: ['#2a241c', SAND], hw: ['#15271f', GREEN], os: ['#15271f', GREEN], psp: ['#20252b', '#c9cfd6'], osal: ['#20252b', '#c9cfd6'], cfe: ['#241a22', '#c48ab4'], apps: ['#16212e', '#7cb4f0'] };
    const NAME = { build: ['Build', 'cFE + OSAL + PSP + apps'], hw: [TG.hw, TG.hwFull], os: [TG.os, TG.osFull], psp: ['PSP', 'Platform Support Package'], osal: ['OSAL', 'Operating System Abstraction Layer'], cfe: ['cFE', 'core Flight Executive'], apps: ['Apps', 'ci_lab · to_lab · sch_lab · sample_app'] };
    const starting = !st.pick && !done;
    const cfeOn = (i) => el >= C0 + 4.2 + i * 0.4;
    const SVC = [['ES', 'apps', 'M7 5v14l11-7z'], ['EVS', 'events', 'M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20h4'], ['SB', 'messages', 'M3 12h18M7 8v8M12 8v8M17 8v8'], ['TBL', 'tables', 'M4 5h16v14H4zM4 10h16M10 5v14'], ['TIME', 'clock', 'M12 3a9 9 0 110 18 9 9 0 010-18zM12 7v5l3 2'], ['FS', 'files', 'M6 3h8l4 4v14H6zM14 3v4h4']];
    const appT = (t, icon, at, k) => { const on = el >= at || done || st.pick; return { t, icon, bg: k === 'you' ? 'transparent' : (on ? '#16212e' : '#181d23'), border: k === 'you' ? '1.5px dashed #8a7152' : '1px solid transparent', ic: k === 'you' ? '#d4b48a' : (on ? '#7cb4f0' : '#4b525c'), fg: k === 'you' ? '#f3dcb8' : (on ? '#a9cdf5' : '#5b636d'), stub: k === 'you' ? '#8a7152' : '#34506e' }; };
    const hotFor = (i) => ['M130 0v10M130 10H40v16', 'M130 0v26', 'M130 0v10M130 10h90v16'][i];
    const opt = (t, on) => ({ t, bg: on ? '#15271f' : 'transparent', border: on ? '#2f6e58' : '#2b313a', fg: on ? '#9fe3c9' : '#5b636d' });
    const ex = { title: NAME[active][0], full: NAME[active][1], icon: ICON[active], tile: KK[active][0], ic: KK[active][1],
      dot: starting ? SAND : GREEN, dotCls: starting ? 'fs-pulse' : '',
      isBuild: active === 'build', isHw: active === 'hw', isOs: active === 'os', isStackDiag: active === 'psp' || active === 'osal', isCfe: active === 'cfe', isApps: active === 'apps',
      srcs: ['cfe/', 'osal/', 'psp/', 'apps/'],
      dash: tg === 'emu' ? '6 4' : '0', chips: tg === 'native' ? ['x86_64'] : (tg === 'emu' ? ['BCM2711', '4 cores', 'QEMU'] : ['BCM2711', '4 cores']),
      procs: [0, 1, 2, 3, 4, 5, 6, 7].map(i => i === 5 ? { t: 'cFS', bg: SAND, cls: 'fs-pop' } : { t: '', bg: '#20252b', cls: '' }),
      top: active === 'psp' ? { t: 'OSAL', bg: '#20252b', fg: '#c9cfd6' } : { t: 'your app', bg: '#15271f', fg: '#9fe3c9' },
      mid: active === 'psp' ? 'PSP' : 'OSAL',
      opts: active === 'psp' ? [opt('pc-linux', true), opt('pc-rtems', false), opt('vxworks', false)] : [opt('Linux', true), opt('RTEMS', false), opt('VxWorks', false)],
      hot: hotFor(0),
      svc: SVC.map((x, i) => { const on = cfeOn(i) || !!st.pick || done; return { k: x[0], w: x[1], icon: x[2], cls: on && !st.pick && !done ? 'fs-pop' : '', bg: on ? '#241a22' : '#181d23', ic: on ? '#c48ab4' : '#4b525c', fg: on ? '#e7c4dc' : '#5b636d' }; }),
      topApps: [appT('ci_lab', 'M4 13h4l1.5 2.5h5L16 13h4M4 13l2.5-7h11L20 13v5H4z', C0 + 7.2), appT('sch_lab', 'M12 3a9 9 0 110 18 9 9 0 010-18zM12 7v5l3 2', C0 + 8.4)],
      botApps: [appT('to_lab', 'M4 13h4l1.5 2.5h5L16 13h4M4 13l2.5-7h11L20 13v5H4zM12 3v6M9.5 5.5L12 3l2.5 2.5', C0 + 7.8), appT('sample_app', 'M8 8h12v12H8zM4 16V4h12', C0 + 9.0), appT('step 4', 'M12 5v14M5 12h14', 0, 'you')] };

    const mm = Math.floor(el / 60), ss = Math.floor(el % 60);
    return {
      h: this.hdr(), tg: TG, con, phases, states, layers, ex, done,
      conLast: printed.length ? printed[printed.length - 1].text : 'waiting', showCon: st.showCon, toggleCon: () => this.setState({ showCon: !st.showCon }),
      conChev: st.showCon ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6', conRadius: st.showCon ? '6px 6px 0 0' : '6px',
      elapsed: String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'),
      replay: () => this.setState({ el: 0, pick: null, paused: false }),
      togglePause: () => this.setState({ paused: !st.paused }), pauseAria: st.paused ? 'Play' : 'Pause', pauseIcon: st.paused ? 'M8 5v14l11-7z' : 'M8 5v14M16 5v14',
      doneTitle: 'cFS is running'
    };
  }
}

function get(path,scope){let o=scope;for(const k of path.trim().split('.')){o=o==null?undefined:o[k];}return o;}
function interp(str,scope){return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{if(p==='true')return 'true';if(p==='false')return 'false';const v=get(p,scope);return v==null||typeof v==='function'?'':String(v);});}
function render(node,scope,parent){for(const ch of node.childNodes){if(ch.nodeType===3){parent.appendChild(document.createTextNode(interp(ch.textContent,scope)));continue;}if(ch.nodeType!==1)continue;const tag=ch.tagName.toLowerCase();
if(tag==='sc-if'){const m=ch.getAttribute('value').match(/\{\{\s*([\w.]+)\s*\}\}/);if(get(m[1],scope))render(ch,scope,parent);continue;}
if(tag==='sc-for'){const m=ch.getAttribute('list').match(/\{\{\s*([\w.]+)\s*\}\}/);const list=get(m[1],scope)||[];const as=ch.getAttribute('as');list.forEach(it=>{const sc=Object.create(scope);sc[as]=it;render(ch,sc,parent);});continue;}
const el=ch.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(ch.namespaceURI,ch.tagName):document.createElement(ch.tagName);
for(const at of ch.attributes){if(at.name.startsWith('hint-'))continue;if(at.name.startsWith('on')){const mm=at.value.match(/\{\{\s*([\w.]+)\s*\}\}/);if(mm){const fn=get(mm[1],scope);if(typeof fn==='function'){el.addEventListener(at.name.slice(2).toLowerCase(),(e)=>{e.stopPropagation();fn(e);window.__mount();});el.setAttribute('data-act',mm[1]);}}continue;}el.setAttribute(at.name,interp(at.value,scope));}
render(ch,scope,el);parent.appendChild(el);}}
const c=new Component({});
let cfg={};try{cfg=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}'));}catch(e){}
Object.assign(c.state,cfg.state||{});
(cfg.calls||[]).forEach(f=>{const v=c.renderVals();const fn=get(f,v);if(typeof fn==='function')fn({target:{value:'0'}});});
for(let i=0;i<(cfg.ticks||0);i++){if(c.tick)c.tick();}
window.__c=c;window.__mount=()=>{const root=document.getElementById('root');root.innerHTML='';render(document.getElementById('tpl').content,c.renderVals(),root);};window.__mount();if(c.componentDidMount)c.componentDidMount();if(!cfg.static)setInterval(()=>{if(c.tick)c.tick();window.__mount();},100);
</script></body></html>
