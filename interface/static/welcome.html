<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#13171c">
<title>Welcome · Flight Studio</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/welcome.css">
<script src="/theme.js"></script>
<script type="module" src="/welcome.js"></script>
</head>
<body><template id="welcome-scenes">
<div class="welcome-frame fs-root" style="min-height: 700px; background: var(--c13171c); color: var(--cd7dbe0); font-family: Inter, system-ui, sans-serif; font-size: 12px; display: flex; flex-direction: column">

<header style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--c22272e)">
<div class="brand-group"><details data-brand-menu><summary class="brand"><strong>Flight</strong> studio</summary><nav>
<a data-destination="welcome">Welcome</a><a data-destination="target">Setup</a></nav></details><span class="brand-divider">/</span><span>{{project}}</span></div>
  <span style="display: flex; align-items: center; gap: 14px"><span style="display: flex; align-items: center; gap: 6px; color: var(--c8e96a1)"><span style="width: 6px; height: 6px; border-radius: 99px; background: var(--c5fc9a3)"></span>Saved</span><button data-theme-toggle aria-label="Switch between light and dark" style="width: 30px; height: 30px; border: 1px solid var(--c2b313a); border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true" style="stroke: var(--ca4acb6)"><path d="{{themeIcon}}"></path></svg></button></span>
</header>

<main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px 32px 20px; gap: 14px">
  <nav aria-label="Chapters" style="width: 1180px; display: flex; align-items: flex-end; gap: 22px">
    <sc-for list="{{groups2}}" as="gr">
      <div style="display: flex; flex-direction: column; gap: 6px; flex: {{gr.flex}}">
        <span class="wc-lbl" style="color: {{gr.fg}}">{{gr.t}}</span>
        <div style="display: flex; align-items: center">
          <sc-for list="{{gr.items}}" as="r">
            <sc-if value="{{r.notFirst}}"><span style="position: relative; flex: 1; min-width: 8px; height: 3px; margin: 0 4px; border-radius: 99px; background: var(--c2b313a); overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{r.fill}}%; border-radius: 99px; background: var(--cd4b48a); transition: width .3s linear"></span></span></sc-if>
            <button data-on-click="r.pick" aria-label="{{r.t}}" title="{{r.t}}" style="width: 28px; height: 28px; flex: none; box-sizing: border-box; padding: 2.5px; border: none; border-radius: 99px; background: {{r.ring}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 100%; height: 100%; border-radius: 99px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{r.ic}}"><path d="{{r.icon}}"></path></svg></span></button>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <button type="button" data-on-click="skip" class="welcome-skip" style="margin-left: auto; height: 26px; display: flex; align-items: center; font-size: 12px; color: var(--c8e96a1); text-decoration: none">Skip</button>
  </nav>
  <div style="width: 1180px; height: 46px; display: flex; align-items: flex-end; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 5px"><span class="wc-lbl" style="color: var(--cd4b48a)">{{eyebrow}}</span><h1 style="margin: 0; font-size: var(--fs-title); font-weight: 400; letter-spacing: -0.01em; color: var(--ceef0f2)">{{title}}</h1></div>
    <sc-if value="{{hasTask}}"><span style="height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid {{task.bd}}; background: {{task.bg}}; display: flex; align-items: center; gap: 8px; font-size: 12px; color: {{task.fg}}; transition: all .3s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{task.ic}}"><path d="{{task.icon}}"></path></svg>{{task.t}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{task.ic}}">{{task.n}}</span></span></sc-if>
    <sc-if value="{{c10}}"><div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px;">
        <sc-for list="{{groups}}" as="g"><span style="display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ca4acb6)"><span style="width: 10px; height: 10px; border-radius: 99px; background: {{g.c}}"></span>{{g.t}}</span></sc-for>
      </div></sc-if>
    <output role="status">{{failure}}</output><span style="flex: 1"></span>
    <sc-if value="{{canBack}}"><button data-on-click="back" class="w-nav ghost"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: currentColor"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back</button></sc-if>
    <sc-if value="{{notLast}}"><button data-on-click="next" class="w-nav {{nextCls}}">Next<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: currentColor"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
    <sc-if value="{{isLast}}"><button type="button" data-on-click="start" class="w-nav {{nextCls}}">Start<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: currentColor"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
  </div>

  <sc-if value="{{c0}}">
    <section class="fs-in" aria-label="What is a satellite" style="width: 1180px; height: 460px; display: flex; gap: 40px">
      <div class="wc-card" style="width: 780px; height: 460px; flex: none">
        <svg width="620" height="420" viewBox="0 0 620 420" fill="none" aria-hidden="true" style="position: absolute; left: 80px; top: 20px">
          <circle cx="40" cy="40" r="1.2" style="fill: var(--c3a424c)"></circle><circle cx="120" cy="90" r="1" style="fill: var(--c3a424c)"></circle><circle cx="210" cy="30" r="1.4" style="fill: var(--c3a424c)"></circle><circle cx="480" cy="50" r="1" style="fill: var(--c3a424c)"></circle><circle cx="560" cy="110" r="1.3" style="fill: var(--c3a424c)"></circle><circle cx="590" cy="300" r="1" style="fill: var(--c3a424c)"></circle><circle cx="520" cy="370" r="1.2" style="fill: var(--c3a424c)"></circle><circle cx="80" cy="300" r="1" style="fill: var(--c3a424c)"></circle><circle cx="450" cy="330" r="1" style="fill: var(--c3a424c)"></circle><circle cx="260" cy="380" r="1.1" style="fill: var(--c3a424c)"></circle><circle cx="600" cy="30" r="1" style="fill: var(--c3a424c)"></circle>
          <circle cx="-40" cy="600" r="320" stroke-width="2" style="fill: var(--c142131); stroke: var(--c1f3550)"></circle>
          <path d="M330 203L174 190" stroke-width="1.5" class="fs-dash" style="stroke: var(--cd4b48a); opacity: {{s0v.wires}}"></path><path d="M330 203L330 96" stroke-width="1.5" class="fs-dash" style="stroke: var(--cd4b48a); opacity: {{s0v.wires}}"></path><path d="M330 203L362 156" stroke-width="1.5" class="fs-dash" style="stroke: var(--cd4b48a); opacity: {{s0v.wires}}"></path><path d="M330 203L300 234" stroke-width="1.5" class="fs-dash" style="stroke: var(--cd4b48a); opacity: {{s0v.wires}}"></path><path d="M330 203L361 276" stroke-width="1.5" class="fs-dash" style="stroke: var(--cd4b48a); opacity: {{s0v.wires}}"></path>
          <g stroke-width="1.5"><rect x="96" y="160" width="154" height="62" rx="3" style="fill: var(--c16212e); stroke: {{s0v.power}}"></rect><path d="M134 160v62M173 160v62M212 160v62M96 191h154" style="stroke: var(--c2a3d55)"></path>
          <rect x="410" y="160" width="154" height="62" rx="3" style="fill: var(--c16212e); stroke: {{s0v.power}}"></rect><path d="M448 160v62M487 160v62M526 160v62M410 191h154" style="stroke: var(--c2a3d55)"></path>
          <path d="M250 191h20M390 191h20" style="stroke: var(--c7d8590)"></path></g>
          <path d="M330 130V100" stroke-width="2" style="stroke: {{s0v.radio}}"></path><path d="M312 92a18 18 0 0036 0z" stroke-width="1.5" style="fill: var(--c20252b); stroke: {{s0v.radio}}"></path>
          <rect x="270" y="130" width="120" height="124" rx="6" stroke-width="1.5" style="fill: var(--c20252b); stroke: var(--c4b525c)"></rect>
          <rect x="278" y="138" width="104" height="108" rx="3" style="fill: var(--c11161c)"></rect>
          <rect x="284" y="144" width="44" height="22" rx="3" stroke-width="1.5" style="fill: var(--c15271f); stroke: {{s0v.power}}"></rect><path d="M292 155h8M296 151v8M312 155h8" stroke-width="1.5" style="stroke: var(--c5fc9a3)"></path>
          <circle cx="362" cy="156" r="14" stroke-width="1.5" style="fill: var(--c20252b); stroke: {{s0v.adcs}}"></circle><circle cx="362" cy="156" r="4" style="fill: {{s0v.adcs}}"></circle>
          <rect x="300" y="184" width="60" height="38" rx="3" stroke-width="1.5" style="fill: var(--c15271f); stroke: {{s0v.obc}}"></rect><rect x="320" y="194" width="20" height="18" rx="2" style="fill: var(--c20252b)"></rect>
          <rect x="284" y="228" width="44" height="12" rx="1" stroke-width="1.5" style="fill: var(--c262c34); stroke: {{s0v.thermal}}"></rect><path d="M292 228v12M300 228v12M308 228v12M316 228v12" style="stroke: var(--c4b525c)"></path>
          <rect x="346" y="254" width="30" height="12" rx="2" stroke-width="1.5" style="fill: var(--c20252b); stroke: {{s0v.payload}}"></rect><circle cx="361" cy="276" r="9" stroke-width="1.5" style="fill: var(--c0d1115); stroke: {{s0v.payload}}"></circle>
        </svg>
        <sc-for list="{{spots}}" as="h">
          <button data-on-click="h.pick" aria-label="{{h.name}}" title="{{h.name}}" class="{{h.cls}}" style="position: absolute; left: {{h.x}}px; top: {{h.y}}px; width: 26px; height: 26px; margin: -13px 0 0 -13px; box-sizing: border-box; padding: 0; border-radius: 99px; border: 1.5px {{h.bs}} {{h.bd}}; background: {{h.bg}}; color: var(--cd4b48a); font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{h.found}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c0d1115)"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
            <sc-if value="{{h.open}}"><span class="fs-pulse" style="line-height: 1">+</span></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="width: 360px; flex: none; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 84px; gap: 10px; align-content: start">
        <sc-for list="{{parts}}" as="p">
          <sc-if value="{{p.found}}">
            <button data-on-click="p.pick" class="fs-pop" style="position: relative; height: 84px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: inherit; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer">
              <span style="width: 32px; height: 32px; flex: none; border-radius: 99px; background: {{p.ibg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{p.ic}}"><path d="{{p.icon}}"></path></svg></span>
              <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: var(--ceef0f2)">{{p.name}}</span><span style="font-size: 11px; color: var(--c8e96a1)">{{p.role}}</span></span>
              <sc-if value="{{p.brain}}"><span class="fs-pop" style="position: absolute; top: -9px; right: 8px; height: 20px; padding: 0 8px; border-radius: 99px; background: var(--cd4b48a); color: var(--c1b150c); font-size: 11px; font-weight: 600; display: flex; align-items: center">flight software</span></sc-if>
            </button>
          </sc-if>
          <sc-if value="{{p.locked}}"><div style="height: 84px; box-sizing: border-box; border-radius: 6px; border: 1px dashed var(--c262c34); display: flex; align-items: center; justify-content: center; color: var(--c3a424c); font-size: 20px">?</div></sc-if>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{c1}}">
    <section class="fs-in" aria-label="Radiation" style="width: 1180px; height: 460px">
      <div class="wc-card" style="width: 1180px; height: 460px">
        <svg width="1180" height="460" viewBox="0 0 1180 460" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
          <circle cx="480" cy="50" r="1.2" style="fill: var(--c3a424c)"></circle><circle cx="560" cy="140" r="1" style="fill: var(--c3a424c)"></circle><circle cx="640" cy="40" r="1.4" style="fill: var(--c3a424c)"></circle><circle cx="720" cy="90" r="1" style="fill: var(--c3a424c)"></circle><circle cx="800" cy="40" r="1.3" style="fill: var(--c3a424c)"></circle><circle cx="860" cy="300" r="1" style="fill: var(--c3a424c)"></circle><circle cx="1100" cy="330" r="1.2" style="fill: var(--c3a424c)"></circle><circle cx="1120" cy="250" r="1" style="fill: var(--c3a424c)"></circle><circle cx="680" cy="260" r="1" style="fill: var(--c3a424c)"></circle><circle cx="760" cy="200" r="1.1" style="fill: var(--c3a424c)"></circle>
          <g style="opacity: {{rd.sunO}}; transition: opacity 1s"><circle cx="1180" cy="-30" r="200" style="fill: var(--ce5786d); opacity: 0.10"></circle><circle cx="1180" cy="-30" r="130" style="fill: var(--ce5786d); opacity: 0.16"></circle><circle class="fs-pulse" cx="1160" cy="10" r="56" style="fill: var(--cf0a35e)"></circle></g>
          <path d="M430 418C700 384 950 384 1180 408V460H430Z" style="fill: var(--c142131)"></path>
          <path d="M560 380Q700 120 905 205" stroke-width="2" stroke-dasharray="5 8" style="stroke: {{rd.pathC}}"></path>
          <g transform="translate(540 404)"><path d="M-30 -4a30 30 0 0060 0z" stroke-width="2.2" style="fill: var(--c20252b); stroke: var(--c9fe3c9)"></path><path d="M0 -4L20 -28M-10 22h20M0 -4v26" stroke-width="2.2" stroke-linecap="round" style="stroke: var(--c9fe3c9)"></path></g>
          <g transform="translate(980 170)" style="opacity: {{rd.satO}}; transition: opacity .4s"><rect x="-150" y="-26" width="96" height="52" rx="4" stroke-width="1.5" style="fill: var(--c16212e); stroke: var(--c34506e)"></rect><path d="M-118 -26v52M-86 -26v52M-150 0h96" style="stroke: var(--c2a3d55)"></path><rect x="54" y="-26" width="96" height="52" rx="4" stroke-width="1.5" style="fill: var(--c16212e); stroke: var(--c34506e)"></rect><path d="M86 -26v52M118 -26v52M54 0h96" style="stroke: var(--c2a3d55)"></path><path d="M-54 0h14M40 0h14" stroke-width="2" style="stroke: var(--c7d8590)"></path><rect x="-40" y="-44" width="80" height="88" rx="8" stroke-width="2" style="fill: var(--c20252b); stroke: var(--c4b525c)"></rect><path d="M-26 44l-26 26" stroke-width="2.4" stroke-linecap="round" style="stroke: var(--c7d8590)"></path></g>
          <circle cx="980" cy="170" r="122" stroke-width="3" stroke-dasharray="10 8" class="{{rd.shCls}}" style="stroke: var(--c5fc9a3); opacity: {{rd.shO}}; transition: opacity .4s"></circle>
          <path d="M1150 30L{{pk.x}} {{pk.y}}" stroke-width="3" stroke-linecap="round" style="stroke: var(--ce5786d); opacity: {{pk.hitO}}"></path>
        </svg>
        <span class="w-ray" style="left: 1100px; top: 10px; animation-delay: 0.0s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 980px; top: -20px; animation-delay: 0.5s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 1140px; top: 90px; animation-delay: 1.1s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 1040px; top: 0px; animation-delay: 1.6s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 920px; top: -10px; animation-delay: 2.0s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 1120px; top: 150px; animation-delay: 0.8s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 1000px; top: 40px; animation-delay: 1.3s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 880px; top: -20px; animation-delay: 0.3s; opacity: {{rd.rayO}}"></span><span class="w-ray" style="left: 1060px; top: 120px; animation-delay: 1.9s; opacity: {{rd.rayO}}"></span>
        <span class="{{rd.flashCls}}" style="position: absolute; left: 940px; top: 130px; width: 80px; height: 80px; border-radius: 99px; pointer-events: none"></span>
        <div style="position: absolute; left: 942px; top: 138px; width: 76px; height: 64px; box-sizing: border-box; border-radius: 4px; background: var(--c13171c); border: 1.5px solid {{rd.batBd}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: {{rd.satO}}">
          <span style="position: relative; width: 34px; height: 16px; box-sizing: border-box; border-radius: 3px; border: 2px solid {{rd.batC}}"><span style="position: absolute; left: 1px; top: 1px; bottom: 1px; width: {{rd.batW}}%; border-radius: 1px; background: {{rd.batC}}; transition: width .15s"></span><span style="position: absolute; right: -5px; top: 3px; width: 3px; height: 6px; border-radius: 1px; background: {{rd.batC}}"></span></span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{rd.batC}}">{{rd.bat}}%</span>
        </div>
        <div style="position: absolute; left: 24px; top: 24px; width: 400px; height: 412px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--c262c34); background: var(--c11161c); display: flex; flex-direction: column; z-index: 2">
          <div style="height: 46px; padding: 0 14px; box-sizing: border-box; border-bottom: 1px solid var(--c22272e); display: flex; align-items: center; gap: 9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c9fe3c9)"><path d="M5 12a7 7 0 0014 0zM12 12l5-6M9 21h6M12 12v9"></path></svg><span style="font-size: 13px; color: var(--ceef0f2)">Ground station</span><span style="flex: 1"></span><span class="wc-chip" style="background: {{rd.linkBg}}; color: {{rd.linkFg}}">{{rd.link}}</span></div>
          <div style="flex: 1; min-height: 0; padding: 8px 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 0; overflow: hidden">
            <sc-for list="{{rd.chat}}" as="m"><div class="fs-in" style="display: flex; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--c1c2128)"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c5b636e)">{{m.time}}</span><span style="width: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{m.ac}}">{{m.arrow}}</span><span style="flex: 1; font-size: 13px; color: {{m.fg}}">{{m.t}}</span></div></sc-for>
          </div>
          <div style="height: 66px; padding: 0 14px; box-sizing: border-box; border-top: 1px solid var(--c22272e); display: flex; align-items: center">
            <sc-if value="{{rd.act}}"><button data-on-click="rd.do" class="fs-coach fs-in" style="position: relative; width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box; border-radius: 6px; border: 1px solid var(--c8a7152); background: var(--c13171c); color: var(--cf3dcb8); font: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--cd4b48a)">›</span><span style="flex: 1; font-size: 13px">{{rd.actT}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c8a7152)">SEND</span></button></sc-if>
            <sc-if value="{{rd.wait}}"><span class="fs-pulse" style="font-size: 13px; color: var(--c8e96a1)">· · ·</span></sc-if>
          </div>
