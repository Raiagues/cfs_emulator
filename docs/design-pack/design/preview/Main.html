    { const ft = checks.find(c => c.todo); if (ft && !checks.some(c => c.fixing)) ft.fixCls = 'fs-pop fs-coach'; }
    const nCheck = checks.filter(c => c.checking).length, nFix = checks.filter(c => c.fixing).length, nTodo = checks.filter(c => c.todo).length;
    const missing = (k) => sets[k].filter(c => !c.ok && !st.fixed[k + ':' + c.label]).length;
    const cs = {};
    ['native', 'emu', 'board'].forEach(k => {
      const m = missing(k), busy = k === t && (nCheck || nFix);
      cs[k] = busy ? { text: nFix ? 'installing' : 'checking', dot: '#d4b48a', cls: 'fs-pulse' } : (m ? { text: m + ' missing', dot: '#d9a35b', cls: '' } : { text: 'ready', dot: '#5fc9a3', cls: '' });
    });
    const canGo = !nCheck && !nFix && !nTodo;
    const title = nCheck ? ['Checking this computer', '#d4b48a', 'fs-pulse'] : (nFix ? ['Installing', '#d9a35b', 'fs-pulse'] : (nTodo ? [nTodo + ' to fix · click it to install', '#e8c08a', ''] : ['Everything is ready', '#5fc9a3', '']));
    return {
      isNative: t === 'native', isEmu: t === 'emu', isBoard: t === 'board',
      pickNative: pick('native'), pickEmu: pick('emu'), pickBoard: pick('board'),
      checks, cs, checkTitle: title[0], checkFg: title[1], checkDotCls: title[2],
      canGo, cantGo: !canGo, waitLabel: nCheck ? 'Checking…' : (nFix ? 'Installing…' : 'Fix ' + nTodo + ' item' + (nTodo > 1 ? 's' : '') + ' to continue'),
      goLabel: t === 'board' ? 'Continue · first boot on the board' : 'Continue · first boot',
      go: () => { this.journeyDone('target'); if (t === 'board' && this.journeyHas('test')) this.journeyDone('board'); }
    };
  }
}

function get(path,scope){let o=scope;for(const k of path.trim().split('.')){o=o==null?undefined:o[k];}return o;}
function interp(str,scope){return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{if(p==='true')return 'true';if(p==='false')return 'false';const v=get(p,scope);return v==null||typeof v==='function'?'':String(v);});}
function render(node,scope,parent){for(const ch of node.childNodes){if(ch.nodeType===3){parent.appendChild(document.createTextNode(interp(ch.textContent,scope)));continue;}if(ch.nodeType!==1)continue;const tag=ch.tagName.toLowerCase();
if(tag==='sc-if'){const m=ch.getAttribute('value').match(/\{\{\s*([\w.]+)\s*\}\}/);if(get(m[1],scope))render(ch,scope,parent);continue;}
if(tag==='sc-for'){const m=ch.getAttribute('list').match(/\{\{\s*([\w.]+)\s*\}\}/);const list=get(m[1],scope)||[];const as=ch.getAttribute('as');list.forEach(it=>{const sc=Object.create(scope);sc[as]=it;render(ch,sc,parent);});continue;}
const el=ch.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(ch.namespaceURI,ch.tagName):document.createElement(ch.tagName);
for(const at of ch.attributes){if(at.name.startsWith('hint-'))continue;if(at.name.startsWith('on')){const mm=at.value.match(/\{\{\s*([\w.]+)\s*\}\}/);if(mm){const fn=get(mm[1],scope);if(typeof fn==='function'){el.addEventListener(at.name.slice(2).toLowerCase(),(e)=>{e.stopPropagation();fn(e);window.__mount();});el.setAttribute('data-act',mm[1]);}}continue;}el.setAttribute(at.name,interp(at.value,scope));}
render(ch,scope,el);parent.appendChild(el);}}
const c=new Component({});
let cfg={};try{cfg=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}'));}catch(e){}
Object.assign(c.state,cfg.state||{});
(cfg.calls||[]).forEach(f=>{const v=c.renderVals();const fn=get(f,v);if(typeof fn==='function')fn({target:{value:'0'}});});
for(let i=0;i<(cfg.ticks||0);i++){if(c.tick)c.tick();}
window.__c=c;window.__mount=()=>{const root=document.getElementById('root');root.innerHTML='';render(document.getElementById('tpl').content,c.renderVals(),root);};window.__mount();if(c.componentDidMount)c.componentDidMount();if(!cfg.static)setInterval(()=>{if(c.tick)c.tick();window.__mount();},100);
</script></body></html>
