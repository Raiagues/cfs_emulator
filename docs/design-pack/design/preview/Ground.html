/*fs-anim*/
@keyframes fsSpin{to{transform:rotate(360deg)}}
.fs-spin{animation:fsSpin .9s linear infinite;transform-origin:50% 50%;transform-box:fill-box}
@keyframes fsDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fs-draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:fsDraw .45s .12s ease-out forwards}
@keyframes fsPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
.fs-pop{animation:fsPop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes fsRing{0%{box-shadow:0 0 0 0 rgba(var(--r95_201_163),.55)}100%{box-shadow:0 0 0 16px rgba(var(--r95_201_163),0)}}
.fs-ring{animation:fsRing 1s ease-out 2}
@keyframes fsIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fs-in{animation:fsIn .35s ease-out both}
@keyframes fsPing2{0%{box-shadow:0 0 0 0 rgba(var(--r212_180_138),.5)}100%{box-shadow:0 0 0 8px rgba(var(--r212_180_138),0)}}
.fs-ping2{animation:fsPing2 1.3s ease-out infinite}
@keyframes fsDash{to{stroke-dashoffset:-20}}
.fs-dash{stroke-dasharray:4 6;animation:fsDash .7s linear infinite}
@keyframes fsPulse{0%,100%{opacity:1}50%{opacity:.4}}
.fs-pulse{animation:fsPulse 1.1s ease-in-out infinite}
/*/fs-anim*/
@keyframes fsCoach2{0%{box-shadow:0 0 0 0 rgba(212,180,138,.45)}100%{box-shadow:0 0 0 8px rgba(212,180,138,0)}}.fs-coach{animation:fsCoach2 1.8s ease-out infinite!important}.fs-coach::after{display:none!important}

      <span style="width: 1px; height: 20px; flex: none; background: var(--c2b313a); margin: 0 4px"></span>
      <button onClick="{{toggleTheme}}" aria-label="Switch between light and dark" style="width: 30px; height: 30px; flex: none; border: none; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--ca4acb6)"><path d="{{themeIcon}}"></path></svg></button>
    </div>
  </div>
</header>
<!--fs-guide-->
<div aria-label="First steps guide" style="height: 44px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--c22272e); background: var(--c161a1f)">
  <span style="flex: none; display: flex; align-items: baseline; gap: 8px"><span style="font-size: 12px; font-weight: 500; color: var(--ceef0f2)">First steps</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c7d8590)">{{gd.count}}/{{gd.total}}</span></span>
  <div style="flex: 1; min-width: 0; display: flex; align-items: center">
    <sc-for list="{{gd.steps}}" as="gs" hint-placeholder-count="9">
      <sc-if value="{{gs.notFirst}}" hint-placeholder-val="{{true}}"><span style="flex: 1; min-width: 8px; height: 2px; border-radius: 2px; background: {{gs.line}}"></span></sc-if>
      <a href="{{gs.href}}" title="{{gs.title}}" style="flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 99px; background: {{gs.bg}}; text-decoration: none">
        <span class="{{gs.cls}}" style="width: 20px; height: 20px; flex: none; box-sizing: border-box; border-radius: 99px; border: 1.5px solid {{gs.border}}; background: {{gs.fill}}; display: flex; align-items: center; justify-content: center">
          <sc-if value="{{gs.done}}" hint-placeholder-val="{{false}}"><svg class="fs-draw" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c9fe3c9)"><path d="M5 12l5 5L20 7" pathLength="1"></path></svg></sc-if>
          <sc-if value="{{gs.notDone}}" hint-placeholder-val="{{true}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{gs.num}}">{{gs.n}}</span></sc-if>
        </span>
        <span style="font-size: 11px; color: {{gs.fg}}; white-space: nowrap">{{gs.label}}</span>
      </a>
    </sc-for>
  </div>
  <span style="flex: none; display: flex; align-items: center; gap: 8px">
    <sc-if value="{{gd.away}}" hint-placeholder-val="{{false}}"><a href="{{gd.href}}" title="{{gd.title}}" class="fs-coach" style="position: relative; height: 28px; flex: none; padding: 0 12px; border-radius: 4px; background: var(--cd4b48a); color: var(--c1b150c); font-size: 12px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px; white-space: nowrap"><span style="font-weight: 400; opacity: 0.75">Next</span>{{gd.go}}<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c1b150c)"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-if>
    <button onClick="{{gd.reset}}" aria-label="Start the guide over" title="Start over" style="width: 26px; height: 26px; flex: none; border-radius: 4px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--c6b7380)"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.5L4 8.5M4 4v4.5h4.5"></path></svg></button>
  </span>
</div>
<!--/fs-guide-->

<div style="flex: 1; display: flex">
  <nav aria-label="Sections" style="flex: 0 0 56px; border-right: 1px solid var(--c22272e); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px">
    <a href="Mission.dc.html" aria-label="Mission" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--c7d8590)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3l9 4.5-9 4.5-9-4.5z"></path><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"></path></svg></a>
    <a href="AddCommand.dc.html" aria-label="Code" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--c7d8590)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg></a>
    <a href="Lesson.dc.html" aria-label="Ground station" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--c7d8590)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.5 7.5a6.4 6.4 0 000 9M16.5 7.5a6.4 6.4 0 010 9M4.6 4.6a10.5 10.5 0 000 14.8M19.4 4.6a10.5 10.5 0 010 14.8"></path></svg></a>
    <a href="#" aria-label="Sensor data" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--c232930); color: var(--ce8cda8)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12c2.5-6 5-6 7.5 0s5 6 7.5 0 3.5-4 5-2"></path></svg></a>
  </nav>

  <aside aria-label="Simulation" style="flex: 0 0 236px; border-right: 1px solid var(--c22272e); background: var(--c15191e); display: flex; flex-direction: column">
    <div style="height: 44px; padding: 0 14px; display: flex; align-items: center; border-bottom: 1px solid var(--c1f242a)"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--c8e96a1)">SYNTHETIC DATA</span></div>
    <div style="padding: 10px 8px; display: flex; flex-direction: column; gap: 4px">
      <button onClick="{{selOrbit}}" style="padding: 9px 10px; border: 1px solid {{orbitItem.border}}; border-radius: 6px; background: {{orbitItem.bg}}; color: inherit; font: inherit; text-align: left; display: flex; align-items: center; gap: 10px; cursor: pointer">
        <span style="width: 28px; height: 28px; flex: none; border-radius: 6px; background: var(--c1a2f48); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" style="stroke: var(--ca9cdf5)"><circle cx="12" cy="12" r="3.2"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"></ellipse></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: var(--ceef0f2)">Orbit</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c8e96a1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{orbitItem.sub}}</span></span>
      </button>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--c6b7380)">SENSORS</span>
        <span style="font-size: 11px; color: var(--c8e96a1)">{{sentCount}} sent to QEMU</span>
      </div>
      <sc-for list="{{sensorList}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 4px; padding: 0 4px 0 2px; border-radius: 6px; border: 1px solid {{s.border}}; background: {{s.bg}}">
          <button onClick="{{s.toggle}}" aria-label="Send {{s.name}} to QEMU" aria-pressed="{{s.aria}}" style="width: 30px; height: 44px; flex: none; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 3px; border: 1.5px solid {{s.boxBorder}}; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: {{s.check}}"><path d="M5 12l5 5L20 7"></path></svg></span></button>
          <button onClick="{{s.pick}}" style="flex: 1; min-width: 0; height: 44px; padding: 0; border: none; background: transparent; color: inherit; font: inherit; text-align: left; display: flex; align-items: center; gap: 8px; cursor: pointer">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: {{s.fg}}">{{s.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c6b7380); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.model}}</span></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{s.valFg}}; white-space: nowrap">{{s.value}}</span>
          </button>
        </div>
      </sc-for>
      <button onClick="{{openAdd}}" style="margin-top: 4px; height: 36px; padding: 0 10px; border-radius: 6px; border: 1px dashed var(--c343c47); background: transparent; color: var(--ca4acb6); font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="stroke: var(--ca4acb6)"><path d="M12 5v14M5 12h14"></path></svg>Add sensor</button>
    </div>
    <span style="flex: 1"></span>
  </aside>

      info([['epoch', '2026-11-19 12:00'], ['period', pMin.toFixed(1) + ' min'], ['eccentricity', O.e.toFixed(4)], ['β angle now', beta.toFixed(1) + '°'], ['eclipse', Math.round(100 * eclN / NS) + '% · ' + (pMin * eclN / NS).toFixed(0) + ' min', '#a9cdf5'], ['node drift', drift.toFixed(3) + '°/day', sso ? '#9fe3c9' : '#eef0f2'], ['sun-synch.', sso ? 'yes' : 'no', sso ? '#9fe3c9' : '#a4acb6']]);

      head('CONNECTION');
      info([['bus', 'i2c-bus.1'], ['address', sel.addr], ['QEMU model', sel.model], ['driver', sel.kind === 'generic' ? 'yours' : sel.model + '_lib']]);
    }

    /* add sensor */
    const MODELS = { tmp105: ['temperature', 'QEMU built in', '0x48', 'temp'], tmp421: ['temperature', 'QEMU built in', '0x4c', 'temp'], lsm303dlhc_mag: ['magnetometer', 'QEMU built in', '0x1e', 'mag'], dps310: ['pressure', 'QEMU built in', '0x77', 'generic'], mpu6050: ['accelerometer', 'your model', '0x68', 'generic'] };
    const addModels = Object.keys(MODELS).map(id => { const a = st.addModel === id, m = MODELS[id]; return { name: id, sub: m[0], tag: m[1], tagBg: m[1] === 'your model' ? 'rgba(195,166,255,0.15)' : '#20252b', tagFg: m[1] === 'your model' ? '#c3a6ff' : '#9aa2ad', border: a ? '#d4b48a' : '#2b313a', bg: a ? '#2a241c' : 'transparent', pick: () => this.setState({ addModel: id }) }; });

    const speeds = [1, 60, 600].map(v => ({ label: v + '×', bg: st.speed === v ? '#2c333c' : 'transparent', fg: st.speed === v ? '#eef0f2' : '#8e96a1', pick: () => this.setState({ speed: v }) }));
    const d = new Date(Date.UTC(2026, 10, 19, 12, 0, 0) + t * 1000);

    return {
      h: this.hdr(),
      selOrbit: () => this.setState({ sel: 'orbit' }), orbitItem, sensorList, sentCount: String(on.length),
      openAdd: () => this.setState({ showAdd: true }), closeAdd: () => this.setState({ showAdd: false }), showAdd: st.showAdd, addModels, addBuses,
      addLine: '-device ' + st.addModel + ',bus=i2c-bus.1,address=' + am[2],
      confirmAdd: () => { const id = st.addModel + (S.some(x => x.id === st.addModel) ? '_2' : ''); const kind = am[3]; this.setState({ showAdd: false, sel: id, sensors: S.concat([{ id, kind, name: am[0][0].toUpperCase() + am[0].slice(1), model: st.addModel, addr: am[2], on: true, src: 'manual', size: '1U', alpha: 0.7, eps: 0.7, pint: 1, mass: 1.3, noise: kind === 'mag' ? 0.2 : 0.05, val: kind === 'temp' ? 20 : (kind === 'mag' ? 30 : (st.addModel === 'dps310' ? 1013 : 0)), periodic: false, amp: 1, per: 30, field: 'dipole', att: 'nadir', rate: 2, axis: 'all', color: '#c3a6ff' }]) }); },
      tabs, speeds, clock: d.toISOString().slice(0, 10) + ' ' + d.toISOString().slice(11, 19) + ' UTC · orbit ' + (k + 1),
      togglePlay: () => this.setState({ playing: !st.playing }), playAria: st.playing ? 'Pause' : 'Play', playIcon: st.playing ? 'M8 5v14M16 5v14' : 'M8 5v14l11-7z',
      strip,
      isSignals: st.tab === 'signals', isPython: st.tab === 'python', isQemu: st.tab === 'qemu', isTest: st.tab === 'test',
      g: gl, m: tr, facts, charts,
      py, con, dryRun: () => this.setState({ dry: !st.dry, dryT0: t }), dryLabel: st.dry ? 'Stop dry run' : 'Dry run', dryIcon: st.dry ? 'M8 6h8a2 2 0 012 2v8a2 2 0 01-2 2H8a2 2 0 01-2-2V8a2 2 0 012-2z' : 'M7.5 5.2v13.6a.6.6 0 00.9.5l10.6-6.8a.6.6 0 000-1L8.4 4.7a.6.6 0 00-.9.5z',
      sendToggle: () => this.setSynth(!synth), sendLabel: synth ? 'Stop sending' : 'Send to QEMU', sendBg: synth ? '#8a7152' : '#d4b48a',
      chain, chainHead, chainNote: '', qcmd, buses,
      scen, runTest: () => this.setState({ testP: 0 }), testCoach: gSensorDone && !gTestDone && st.testP < 0 ? 'fs-coach' : '', stripCoach: !synth && !gSensorDone ? 'fs-coach' : '', testBtn: st.testP >= 0 && st.testP < 1 ? 'Running' : (st.testP >= 1 ? 'Run again' : 'Run test'), testBtnBg: st.testP >= 0 && st.testP < 1 ? '#8a7152' : '#d4b48a', testPct: String(Math.round(prog * 100)),
      tc, checks, testSum: st.testP < 0 ? CK.length + ' checks' : (st.testP < 1 ? 'running · ' + nDone + ' of ' + CK.length : nPass + ' of ' + CK.length + ' passed'), testSumFg: st.testP >= 1 ? (nPass === CK.length ? '#9fe3c9' : '#f4b3a5') : '#8e96a1',
      panel, ctl
    };
  }
}

function get(path,scope){let o=scope;for(const k of path.trim().split('.')){o=o==null?undefined:o[k];}return o;}
function interp(str,scope){return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{if(p==='true')return 'true';if(p==='false')return 'false';const v=get(p,scope);return v==null||typeof v==='function'?'':String(v);});}
function render(node,scope,parent){for(const ch of node.childNodes){if(ch.nodeType===3){parent.appendChild(document.createTextNode(interp(ch.textContent,scope)));continue;}if(ch.nodeType!==1)continue;const tag=ch.tagName.toLowerCase();
if(tag==='sc-if'){const m=ch.getAttribute('value').match(/\{\{\s*([\w.]+)\s*\}\}/);if(get(m[1],scope))render(ch,scope,parent);continue;}
if(tag==='sc-for'){const m=ch.getAttribute('list').match(/\{\{\s*([\w.]+)\s*\}\}/);const list=get(m[1],scope)||[];const as=ch.getAttribute('as');list.forEach(it=>{const sc=Object.create(scope);sc[as]=it;render(ch,sc,parent);});continue;}
const el=ch.namespaceURI==='http://www.w3.org/2000/svg'?document.createElementNS(ch.namespaceURI,ch.tagName):document.createElement(ch.tagName);
for(const at of ch.attributes){if(at.name.startsWith('hint-'))continue;if(at.name.startsWith('on')){const mm=at.value.match(/\{\{\s*([\w.]+)\s*\}\}/);if(mm){const fn=get(mm[1],scope);if(typeof fn==='function'){el.addEventListener(at.name.slice(2).toLowerCase(),(e)=>{e.stopPropagation();fn(e);window.__mount();});el.setAttribute('data-act',mm[1]);}}continue;}el.setAttribute(at.name,interp(at.value,scope));}
render(ch,scope,el);parent.appendChild(el);}}

let cfg={};try{cfg=JSON.parse(decodeURIComponent(location.hash.slice(1)||'{}'));}catch(e){}
Object.assign(c.state,cfg.state||{});
