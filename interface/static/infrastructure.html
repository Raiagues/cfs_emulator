<!doctype html>
<html lang="en" data-page="setup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13171c">
  <title>Choose target · Flight Studio</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/design.css">
  <link rel="stylesheet" href="/infrastructure.css">
  <link rel="stylesheet" href="/setup-progress.css">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="setup-header">
    <div class="brand-group"><details data-brand-menu><summary class="brand"><strong>Flight</strong> studio</summary><nav>
<a data-destination="welcome">Welcome</a><a data-destination="target">Setup</a></nav></details><span class="brand-divider">/</span><span id="project-name"></span></div>
    <div class="header-actions"><span id="save-state" role="status"></span><button type="button" data-theme-toggle aria-label="Switch theme"></button></div>
  </header>
  <nav id="flight-guide" aria-label="First flight"></nav>
  <main><form id="infrastructure-form" novalidate>
    <h1>Choose target</h1>
    <div id="targets" role="group" aria-label="Execution target">
        <button type="button" class="target-option" data-target="native" aria-pressed="false" disabled>
          <span class="target-illustration" data-art="native"></span>
          <span class="target-caption"><strong>Native</strong><small>This computer</small></span>
        </button>
        <svg class="target-connector" viewBox="0 0 48 12" aria-hidden="true"><path d="M2 6h36" stroke-dasharray="3 4"/><path d="m38 1 6 5-6 5"/></svg>
        <button type="button" class="target-option" data-target="qemu" aria-pressed="false" disabled>
          <span class="target-illustration" data-art="qemu"></span>
          <span class="target-caption"><strong>Emulator</strong><small>QEMU</small></span>
        </button>
        <svg class="target-connector" viewBox="0 0 48 12" aria-hidden="true"><path d="M2 6h36" stroke-dasharray="3 4"/><path d="m38 1 6 5-6 5"/></svg>
        <button type="button" class="target-option" data-target="physical" aria-pressed="false" disabled>
          <span class="target-illustration" data-art="physical"></span>
          <span class="target-caption"><strong>Board</strong><small>SSH</small></span>
        </button>
    </div>
    <section class="setup-panel" hidden aria-label="Target configuration">
      <div class="configuration-row">
        <div id="configuration"></div>
        <div class="group-summary"><span id="group-summary" role="status"></span><div id="requirements" role="group" aria-label="Setup checks"></div></div>
      </div>
    </section>
    <footer class="setup-footer" hidden>
      <button type="button" id="verify-target" hidden>Check target</button>
      <button type="submit" class="primary" id="enter" hidden disabled>Continue · first boot</button>
      <button type="button" id="inspect" class="quiet" disabled>Details</button>
    </footer>
    <details class="terminal-twin"><summary>In the terminal</summary><pre id="target-cli"></pre></details>
    <p id="feedback" role="status" aria-live="polite"></p>
  </form></main>
  <dialog id="settings-sheet" aria-labelledby="settings-title">
    <header><h2 id="settings-title">Target settings</h2><button type="button" class="close-dialog" aria-label="Close settings">×</button></header>
    <form id="target-settings-form" novalidate>
      <div id="advanced"></div>
      <output id="settings-error" role="alert"></output>
      <footer><button id="settings-cancel" type="button">Cancel</button><button type="submit" class="primary">Save settings</button></footer>
    </form>
  </dialog>
  <dialog id="verification" aria-labelledby="check-status">
    <header><h2 id="check-status">Setup details</h2><button type="button" class="close-dialog" aria-label="Close details">×</button></header>
    <div id="check-groups" role="group" aria-label="Check group"></div>
    <div id="checks"></div>
    <label id="jobs-detail" hidden>Parallel build jobs <input id="build-jobs" name="build_jobs" type="number" min="1" max="64" required><small role="alert"></small></label>
    <footer><button id="show-terminal" class="quiet" type="button" hidden>Installer log</button><button id="check" type="button">Check again</button><button id="fix-group" class="primary" type="button" hidden></button></footer>
  </dialog>
  <dialog id="setup-terminal" class="output-panel" aria-labelledby="terminal-title">
    <header><strong id="terminal-title">Installer terminal</strong><span id="terminal-state" role="status"></span><button type="button" class="close-dialog" aria-label="Close terminal">×</button></header>
    <div id="shell-terminal" hidden></div>
  </dialog>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/journey.js" type="module"></script>
  <script src="/infrastructure.js" type="module"></script>
</body>
</html>
