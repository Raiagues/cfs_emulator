<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#191b20">
  <title>Flight Studio</title>
  <link rel="stylesheet" href="/prototype.css">
  <link rel="stylesheet" href="/panels.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/terminal.css">
  <link rel="stylesheet" href="/architecture.css">
  <link rel="stylesheet" href="/mission-diagram.css">
  <link rel="stylesheet" href="/app-diagram.css">
  <link rel="stylesheet" href="/communication.css">
  <link rel="stylesheet" href="/simulation.css">
</head>
<body class="no-terminal" data-view="architecture">
  <header class="topbar">
    <div class="workspace-identity">
      <a class="brand" href="/" aria-label="Flight Studio"><span>Flight<span class="brand-studio">studio</span></span></a>
      <div class="project-title"><span class="slash">/</span><span id="project-title"></span></div>
    </div>
    <div class="execution-toolbar">
      <a class="infrastructure-link" href="/" title="Infrastructure settings" aria-label="Infrastructure settings"><span class="icon" data-icon="settings"></span></a>
      <div class="profile-selectors" aria-label="Build configuration">
        <div class="toolbar-field board-field"><button id="board-select" class="profile-trigger" aria-label="Board" aria-haspopup="listbox" aria-expanded="false" aria-controls="board-select-options" disabled><span class="icon" data-icon="cpu"></span><span class="profile-value">Loading…</span><span class="icon profile-chevron" data-icon="chevron-down"></span></button><div id="board-select-options" class="profile-menu" role="listbox" aria-label="Board" hidden></div></div>
        <div class="toolbar-field system-field"><button id="os-select" class="profile-trigger" aria-label="Operating system" aria-haspopup="listbox" aria-expanded="false" aria-controls="os-select-options" disabled><span class="profile-value">Loading…</span><span class="icon profile-chevron" data-icon="chevron-down"></span></button><div id="os-select-options" class="profile-menu" role="listbox" aria-label="Operating system" hidden></div></div>
      </div>
      <span id="native-host" class="native-host" hidden></span>
      <div class="target-switch" role="group" aria-label="Run cFS on">
        <button data-target="native" aria-pressed="true" title="Run cFS on this computer">Native</button>
        <button data-target="qemu" aria-pressed="false" title="Run in the QEMU emulator">Emulator</button>
        <button data-target="physical" aria-pressed="false" title="Run on the physical board">Board</button>
      </div>
      <div class="top-actions actions" aria-label="Linux and flight software actions">
        <button class="toolbar-action boot-action" data-job="boot" title="Start the QEMU emulator and boot Linux"><span class="icon" data-icon="cpu"></span><span class="action-label">Start QEMU + Linux</span></button>
        <button class="toolbar-action shutdown-action" data-job="shutdown" title="Stop the QEMU emulator and its Linux system"><span class="icon" data-icon="power"></span><span>Stop QEMU</span></button>
        <button class="toolbar-action build-action" data-job="build" title="Compile cFS for the selected board and system"><span class="icon" data-icon="build"></span><span>Build cFS</span></button>
        <button class="toolbar-action run-action" data-job="run" title="Run cFS on the selected target"><span class="icon" data-icon="play"></span><span>Run cFS</span></button>
        <button class="toolbar-action stop-action" aria-label="Stop cFS" data-job="stop" title="Stop cFS on the selected target" disabled><span class="icon" data-icon="stop"></span><span>Stop cFS</span></button>
        <button id="run-simulation" class="toolbar-action synthetic-action" disabled><span class="icon" data-icon="wave"></span>Start synthetic data</button>
        <button id="stop-simulation" class="toolbar-action synthetic-action" hidden><span class="icon" data-icon="stop"></span>Stop synthetic data</button>
        <button id="configure-simulation" class="toolbar-action" data-view="simulation" title="Configure synthetic data" aria-label="Configure synthetic data"><span class="icon" data-icon="settings"></span></button>
      </div>
    </div>
    <div id="operation-status" class="operation-status" role="status" hidden><i class="operation-spinner" aria-hidden="true"></i><span id="operation-label"></span><span id="operation-time"></span><button id="operation-output">Show output</button></div>
  </header>
  <div id="feedback" class="workspace-feedback" role="status" aria-live="polite"></div>
  <main class="studio" id="studio">
    <nav class="activity-rail rail" aria-label="Project areas">
      <div>
        <button class="rail-button" data-view="code" title="Code" aria-label="Code"><span class="icon" data-icon="code"></span></button>
        <button class="rail-button" data-view="architecture" title="Architecture" aria-label="Architecture"><span class="icon" data-icon="workflow"></span></button>
        <button class="rail-button active" data-view="bench" title="Hardware" aria-label="Hardware"><span class="icon" data-icon="circuit"></span></button>
        <button class="rail-button" data-view="simulation" title="Synthetic data" aria-label="Synthetic data"><span class="icon" data-icon="wave"></span></button>
        <button class="rail-button" data-view="ground" title="Ground station" aria-label="Ground station"><span class="icon" data-icon="antenna"></span></button>
        <button class="rail-button" id="toggle-terminal" title="Terminal · Ctrl+`" aria-label="Terminal" aria-controls="terminal-panel" aria-expanded="false"><span class="icon" data-icon="terminal"></span></button>
      </div>
    </nav>
    <aside class="explorer">
      <header class="explorer-heading"><span id="explorer-title">FLIGHT SOFTWARE</span><div class="explorer-tools"><button class="icon-button" id="search-files" title="Find a file · Ctrl+P" aria-label="Find a file" aria-expanded="false"><span class="icon" data-icon="search"></span></button><button class="icon-button" id="hide-explorer" title="Hide sidebar · Ctrl+B" aria-label="Hide sidebar"><span class="icon" data-icon="sidebar"></span></button></div></header>
      <div id="file-search" hidden><input id="file-query" type="search" placeholder="Find a file…" aria-label="Find a file by name"><div id="file-results" role="status"></div></div>
      <div id="tree" class="file-tree" aria-label="Flight software files"></div>
    </aside>
    <div id="explorer-splitter" class="splitter" role="separator" aria-label="Explorer width" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <section class="workarea">
      <button id="show-explorer" class="icon-button" title="Show sidebar · Ctrl+B" aria-label="Show sidebar"><span class="icon" data-icon="sidebar"></span></button>
      <div class="panes">
        <section class="editor editor-workspace">
          <div id="simulation-toolbar" hidden><strong>Synthetic data</strong><div class="signals-modes"><button data-simulation-mode="widgets">Widgets</button><button data-simulation-mode="code">Code</button></div><button data-simulation-save>Save</button><button data-simulation-test title="Run finite samples without sending data to QEMU">Test code</button><button data-simulation-start>Start</button><button data-simulation-stop hidden>Stop</button></div>
          <div id="simulation-fields" hidden></div>
          <div class="tabbar"><div id="tabs" class="tabs file-tabs"></div><div class="editor-actions"><button class="icon-button" id="find-toggle" title="Find in file · Ctrl+F" aria-label="Find in file"><span class="icon" data-icon="search"></span></button><button class="icon-button" id="editor-expand" title="Expand editor" aria-label="Expand editor"><span class="icon" data-icon="expand"></span></button></div></div>
          <div id="find-bar" class="find-bar hidden"><input id="find-query" placeholder="Find in this file" aria-label="Find in this file"><button id="find-next" class="icon-button" title="Next result"><span class="icon" data-icon="arrow-down"></span></button><button id="find-close" class="icon-button" title="Close search"><span class="icon" data-icon="close"></span></button></div>
          <div id="source-location" class="source-location" hidden><span></span><small>Read only</small></div>
          <div class="code-wrap code-area">
            <pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre>
            <div class="code-stack"><pre id="highlight-layer" class="highlight-layer" aria-hidden="true"><code id="highlight-code"></code></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Code editor" disabled></textarea></div>
          </div>
        </section>
        <div id="editor-splitter" class="splitter" role="separator" aria-label="Editor and panel split" aria-orientation="vertical" tabindex="0" title="Drag to resize · double-click to reset"></div>
        <section class="visual">
          <header id="visual-heading" class="visual-tabbar"><span id="visual-title"></span><button id="toggle-editor" class="icon-button" title="Expand panel"><span class="icon" data-icon="expand"></span></button></header>
          <div id="view"></div>
        </section>
      </div>
      <div id="terminal-splitter" class="splitter horizontal" role="separator" aria-label="Terminal height" aria-orientation="horizontal" tabindex="0" title="Drag to resize · double-click to reset"></div>
      <section class="terminal console" id="terminal-panel" aria-label="Terminal">
        <header class="console-heading"><span>TERMINAL</span><span id="terminal-title"></span><span id="job-status"></span><button class="icon-button" id="minimize-terminal" title="Minimize terminal · Ctrl+`" aria-label="Minimize terminal"><span class="icon" data-icon="minus"></span></button></header>
        <div class="terminal-body"><pre id="logs" role="log" aria-live="off" tabindex="0">Run cFS to see flight output here.</pre><div id="shell-terminal" hidden></div><nav id="terminal-sessions" aria-label="Terminal sessions"></nav></div>
      </section>
    </section>
  </main>
  <dialog id="dialog"><form id="dialog-form"><header><h2 id="dialog-title"></h2><button type="button" id="close-dialog" class="icon-button" aria-label="Close"><span class="icon" data-icon="close"></span></button></header><div id="dialog-body"></div><p id="dialog-error" role="alert"></p><footer><button type="button" id="cancel-dialog">Cancel</button><button class="primary" type="submit">Apply</button></footer></form></dialog>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
